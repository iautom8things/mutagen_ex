name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  build:
    name: Compile, test, format
    runs-on: ubuntu-latest
    # The whole job runs in ~1.5 min; this bounds a runaway/hung test so it
    # fails with a clear timeout instead of an ambiguous external cancellation.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Run integration tests
        run: mix test.integration

  specs:
    name: Spec contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - run: mix deps.get
      - run: mix spec.validate --strict
      - name: Check the change against its base
        env:
          SPEC_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$SPEC_BASE" = "0000000000000000000000000000000000000000" ]; then
            SPEC_BASE="origin/$DEFAULT_BRANCH"
          fi
          mix spec.check --base "$SPEC_BASE"
