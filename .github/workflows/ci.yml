name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  build:
    name: Compile, test, format
    runs-on: ubuntu-latest
    # Bound the unit, archive, and Postgres integration runs.
    timeout-minutes: 10

    env:
      HOST_SETUP_DB_HOST: 127.0.0.1
      HOST_SETUP_DB_USER: postgres
      HOST_SETUP_DB_PASSWORD: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Run integration tests
        run: mix test.integration

  specs:
    name: Spec contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache spec dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-specs-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - run: mix deps.get
      - run: mix spec.validate --strict
      - name: Check the change against its base
        env:
          EVENT_NAME: ${{ github.event_name }}
          SPEC_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Checkout uses GitHub's PR merge commit. Its first parent is the tested base.
            SPEC_BASE="$(git rev-parse HEAD^1)"
          elif [ "$SPEC_BASE" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$SPEC_BASE^{commit}" 2>/dev/null; then
            SPEC_BASE="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
          fi
          mix spec.check --base "$SPEC_BASE"
